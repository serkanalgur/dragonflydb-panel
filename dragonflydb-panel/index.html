<!--
  aaPanel injects this file into its own layout inside a layui modal layer.
  It MUST be a fragment: no <!DOCTYPE>, <html>, <head>, <body> or <title>.
  A full document nests a <body> inside the panel's and the template fails to
  render, which the panel reports as "Getting template" and then bounces to the
  home page.

  Backend: POST /plugin?action=a&name=dragonflydb&s=<Method>
  Replies are public.ReturnMsg: {"status": bool, "msg": string}.
  Structured payloads arrive JSON-encoded inside `msg`.
  jQuery ($) and the panel's own stylesheets are already present.
-->
<div class="bt-form dfd-root">
    <div class="bt-w-main">
        <div class="bt-w-menu">
            <p class="bgw">Overview</p>
        </div>
        <div class="bt-w-con pd15">
            <div class="plugin_body">

                <style>
                    .dfd-root { color: #1f2933; }
                    .dfd-root section {
                        border: 1px solid #e4e7eb; border-radius: 6px;
                        padding: 20px; margin-bottom: 20px; background: #fff;
                    }
                    .dfd-root section > h2 { font-size: 15px; margin: 0 0 16px; }
                    .dfd-grid {
                        display: grid; gap: 16px;
                        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                    }
                    .dfd-stats {
                        display: grid; gap: 12px;
                        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                    }
                    .dfd-root label { display: block; font-weight: 600; margin-bottom: 4px; }
                    .dfd-root input, .dfd-root select {
                        width: 100%; padding: 8px 10px;
                        border: 1px solid #cbd2d9; border-radius: 4px;
                    }
                    .dfd-root .dfd-field small {
                        display: block; color: #7b8794; font-weight: 400; margin-top: 4px;
                    }
                    .dfd-root .dfd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
                    .dfd-root .dfd-stat {
                        border: 1px solid #e4e7eb; border-radius: 4px; padding: 12px;
                    }
                    .dfd-root .dfd-stat span { display: block; color: #7b8794; font-size: 12px; }
                    .dfd-root .dfd-stat strong { font-size: 18px; font-weight: 600; }
                    .dfd-msg { padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; display: none; }
                    .dfd-msg.ok { display: block; background: #e6f6ec; border: 1px solid #a7dfb9; }
                    .dfd-msg.err { display: block; background: #fdeaea; border: 1px solid #f5b5b5; }
                    .dfd-log {
                        background: #1f2933; color: #e4e7eb; padding: 14px; border-radius: 4px;
                        overflow: auto; max-height: 340px; font-size: 12px; white-space: pre-wrap;
                    }
                    /* Environment indicator. The colour is decoration; the text
                       beside it is the signal, so colour is never the only cue. */
                    .dfd-env { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
                    .dfd-dot {
                        width: 11px; height: 11px; border-radius: 50%; flex: none;
                        background: #9aa5b1; box-shadow: 0 0 0 3px rgba(154, 165, 177, .18);
                    }
                    .dfd-dot.ok { background: #20a53a; box-shadow: 0 0 0 3px rgba(32, 165, 58, .18); }
                    .dfd-dot.bad { background: #d64b4b; box-shadow: 0 0 0 3px rgba(214, 75, 75, .18); }
                    .dfd-env-label { font-weight: 600; }
                    .dfd-env-detail { color: #7b8794; }
                    .dfd-root button:disabled { opacity: .45; cursor: not-allowed; }
                    .dfd-warn {
                        margin-top: 14px; padding: 10px 14px; border-radius: 4px;
                        background: #fff6e5; border: 1px solid #f0c36d; color: #856404;
                    }
                </style>

                <div class="dfd-msg" id="dfd_msg"></div>

                <section>
                    <h2>Service</h2>

                    <div class="dfd-env">
                        <span class="dfd-dot" id="dfd_docker_dot"></span>
                        <span class="dfd-env-label" id="dfd_docker_label">Checking Docker&hellip;</span>
                        <span class="dfd-env-detail" id="dfd_docker_detail"></span>
                    </div>

                    <div class="dfd-warn" id="dfd_docker_warn" style="display:none;"></div>

                    <div class="dfd-actions">
                        <button class="btn btn-primary" id="dfd_btn_install" onclick="dfdAct('Install');">Install</button>
                        <button class="btn" id="dfd_btn_start" onclick="dfdAct('Start');">Start</button>
                        <button class="btn" id="dfd_btn_stop" onclick="dfdAct('Stop');">Stop</button>
                        <button class="btn" id="dfd_btn_restart" onclick="dfdAct('Restart');">Restart</button>
                        <button class="btn" id="dfd_btn_logs" onclick="dfdGetLogs();">View logs</button>
                    </div>

                    <div style="margin-top:16px; display:none;" id="dfd_logbox">
                        <div class="dfd-log" id="dfd_logtext"></div>
                    </div>
                </section>

                <section>
                    <h2>Status</h2>
                    <div class="dfd-stats">
                        <div class="dfd-stat"><span>State</span><strong id="dfd_state">&ndash;</strong></div>
                        <div class="dfd-stat"><span>Version</span><strong id="dfd_version">&ndash;</strong></div>
                        <div class="dfd-stat"><span>Keys</span><strong id="dfd_keys">&ndash;</strong></div>
                        <div class="dfd-stat"><span>Clients</span><strong id="dfd_clients">&ndash;</strong></div>
                        <div class="dfd-stat"><span>Memory used</span><strong id="dfd_mem">&ndash;</strong></div>
                    </div>
                </section>

                <section>
                    <h2>Settings</h2>
                    <div class="dfd-grid">
                        <div class="dfd-field">
                            <label for="dfd_port">Port</label>
                            <input id="dfd_port" type="number" value="6380">
                            <small>Must not be 6379, aaPanel's Redis uses it.</small>
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_bind">Bind</label>
                            <select id="dfd_bind">
                                <option>127.0.0.1</option>
                                <option>0.0.0.0</option>
                            </select>
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_password">Password</label>
                            <input id="dfd_password" type="text" placeholder="none">
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_maxmemory">Max memory</label>
                            <input id="dfd_maxmemory" value="1gb">
                            <small>e.g. 512mb, 2gb, 4gb</small>
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_maxmemory_policy">Eviction policy</label>
                            <select id="dfd_maxmemory_policy"></select>
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_snapshot_seconds">Snapshot every (s)</label>
                            <input id="dfd_snapshot_seconds" type="number" value="900">
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_log_level">Log level</label>
                            <select id="dfd_log_level"></select>
                        </div>
                        <div class="dfd-field">
                            <label for="dfd_image_tag">Image tag</label>
                            <input id="dfd_image_tag" value="v1.26.0">
                        </div>
                    </div>
                    <div class="dfd-actions">
                        <button class="btn btn-primary" onclick="dfdSaveSettings();">Save settings</button>
                    </div>
                </section>

            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // All globals are prefixed dfd: index.html is injected into the panel's
    // own page, where a bare `status` or `call` would collide with the panel's.
    var DFD_API = '/plugin?action=a&name=dragonflydb&s=';
    var DFD_FIELDS = ['port', 'bind', 'password', 'maxmemory',
                      'maxmemory_policy', 'snapshot_seconds', 'log_level', 'image_tag'];

    function dfdNotify(text, ok) {
        var el = document.getElementById('dfd_msg');
        el.textContent = text;
        el.className = 'dfd-msg ' + (ok ? 'ok' : 'err');
    }

    function dfdCall(method, params, done, failed) {
        $.post(DFD_API + method, params || {}, function (res) {
            if (!res) { dfdNotify('Empty response from panel', false); return; }
            if (res.status === false) {
                dfdNotify(res.msg || 'Operation failed', false);
                if (failed) { failed(); }
                return;
            }
            // Only announce a message the backend wrote for humans. Structured
            // payloads travel as JSON inside msg and are consumed by `done`;
            // printing one would dump the payload into the message box.
            var isPayload = res.msg && res.msg.charAt(0) === '{';
            if (res.msg && !isPayload) { dfdNotify(res.msg, true); }
            if (done) { done(res.msg); }
        }).fail(function () {
            dfdNotify('Request failed. Is the plugin installed?', false);
            if (failed) { failed(); }
        });
    }

    // Structured payloads are JSON inside msg; a plain message is not.
    function dfdData(msg, fallback) {
        try { return JSON.parse(msg); } catch (e) { return fallback; }
    }

    function dfdRefreshStatus() {
        dfdCall('GetStatus', {}, function (msg) {
            var s = dfdData(msg, null);
            if (!s) { return; }
            document.getElementById('dfd_state').textContent = 'Running';
            document.getElementById('dfd_version').textContent = s.version;
            document.getElementById('dfd_keys').textContent = s.keys;
            document.getElementById('dfd_clients').textContent = s.clients;
            document.getElementById('dfd_mem').textContent = s.used_memory;
        });
    }

    function dfdMarkStopped() {
        document.getElementById('dfd_state').textContent = 'Stopped';
    }

    // ---- environment ------------------------------------------------------

    function dfdSetEnabled(id, enabled, reason) {
        var el = document.getElementById(id);
        el.disabled = !enabled;
        if (reason) { el.title = reason; } else { el.removeAttribute('title'); }
    }

    // Called on load and after every action: a server that loses Docker
    // between clicks shows disabled buttons instead of a shell error.
    function dfdRefreshEnvironment() {
        dfdCall('GetEnvironment', {}, function (msg) {
            var env = dfdData(msg, null);
            if (env) { dfdApplyEnvironment(env); }
        }, null);
    }

    function dfdApplyEnvironment(env) {
        var dot = document.getElementById('dfd_docker_dot');
        var label = document.getElementById('dfd_docker_label');
        var detail = document.getElementById('dfd_docker_detail');
        var warn = document.getElementById('dfd_docker_warn');

        if (env.problem) {
            dot.className = 'dfd-dot bad';
            label.textContent = 'Docker unavailable';
            detail.textContent = env.problem;
            warn.textContent = env.problem + ' Install Docker on the server, then reopen this page.';
            warn.style.display = 'block';
        } else {
            dot.className = 'dfd-dot ok';
            label.textContent = 'Docker ready';
            var parts = [];
            parts.push('compose ' + (env.compose ? 'available' : 'missing'));
            parts.push(env.installed ? 'plugin installed' : 'plugin not installed');
            detail.textContent = '(' + parts.join(', ') + ')';
            warn.style.display = 'none';
        }

        // Everything that shells out to docker needs docker.
        ['dfd_btn_install', 'dfd_btn_start', 'dfd_btn_stop', 'dfd_btn_restart', 'dfd_btn_logs']
            .forEach(function (id) { dfdSetEnabled(id, !env.problem, env.problem || ''); });

        // These additionally need a previous Install to have written the files.
        if (!env.problem && !env.installed) {
            var why = 'Save settings and click Install first.';
            ['dfd_btn_start', 'dfd_btn_stop', 'dfd_btn_restart', 'dfd_btn_logs']
                .forEach(function (id) { dfdSetEnabled(id, false, why); });
        }
    }

    function dfdAct(method) {
        dfdCall(method, {}, dfdRefreshStatus, dfdMarkStopped);
        dfdRefreshEnvironment();
    }

    function dfdSaveSettings() {
        var params = {};
        DFD_FIELDS.forEach(function (key) {
            var el = document.getElementById('dfd_' + key);
            if (el) { params[key] = el.value; }
        });
        // Saving writes the deployment files, which is what makes Start and
        // the rest of the lifecycle actions legal. Re-read the environment so
        // the buttons update without a page reload.
        dfdCall('SetSettings', params, dfdRefreshEnvironment);
    }

    function dfdGetLogs() {
        document.getElementById('dfd_logbox').style.display = 'block';
        dfdCall('GetLogs', { lines: 300 }, function (msg) {
            var data = dfdData(msg, null);
            document.getElementById('dfd_logtext').textContent = (data && data.log) || '(empty)';
        });
    }

    function dfdFillSelect(id, values) {
        var sel = document.getElementById('dfd_' + id);
        values.forEach(function (v) {
            var opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            sel.appendChild(opt);
        });
    }

    dfdFillSelect('maxmemory_policy', ['noeviction', 'allkeys-lru', 'allkeys-random',
                                      'volatile-lru', 'volatile-random', 'volatile-ttl']);
    dfdFillSelect('log_level', ['debug', 'verbose', 'notice', 'warning']);

    dfdCall('GetSettings', {}, function (msg) {
        var settings = dfdData(msg, null);
        if (!settings) { return; }
        Object.keys(settings).forEach(function (key) {
            var el = document.getElementById('dfd_' + key);
            if (el) { el.value = settings[key]; }
        });
    });

    dfdRefreshStatus();
    dfdRefreshEnvironment();
</script>
