name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aaPanel 7.x runs Python 3.12; older panels are on 3.9. The plugin must
        # import and validate cleanly on both.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Quality gates
        run: ./scripts/test.sh

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the installable zip
        run: ./scripts/package.sh

      - name: Upload the zip for manual install testing
        uses: actions/upload-artifact@v4
        with:
          name: dragonflydb-panel-zip
          path: dist/*.zip
          retention-days: 14
